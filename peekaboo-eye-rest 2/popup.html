<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Peekaboo settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24"><g transform="rotate(-12 8.6 7)"><ellipse cx="8.6" cy="7" rx="2.6" ry="5.6" fill="#FFFFFF"/><ellipse cx="8.6" cy="7.6" rx="1.2" ry="3.9" fill="#DCCCAC"/></g><g transform="rotate(12 15.4 7)"><ellipse cx="15.4" cy="7" rx="2.6" ry="5.6" fill="#FFFFFF"/><ellipse cx="15.4" cy="7.6" rx="1.2" ry="3.9" fill="#DCCCAC"/></g><ellipse cx="12" cy="15.6" rx="7" ry="6" fill="#FFFFFF"/><circle cx="9.3" cy="15" r="1" fill="#26332A"/><circle cx="14.7" cy="15" r="1" fill="#26332A"/><ellipse cx="7.6" cy="17.3" rx="1.3" ry="0.8" fill="#DCCCAC"/><ellipse cx="16.4" cy="17.3" rx="1.3" ry="0.8" fill="#DCCCAC"/><path d="M11.1 16.9 L12 17.7 L12.9 16.9" fill="none" stroke="#26332A" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="titles">
      <span class="name">Peekaboo</span>
      <span class="tagline">Your eye-rest buddy</span>
    </div>
    <label class="switch">
      <span class="visually-hidden">Reminders on</span>
      <input type="checkbox" id="enabled">
      <span class="track"><span class="knob"></span></span>
    </label>
  </header>

  <div class="status" id="status">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span id="statusText"></span>
  </div>

  <div class="sections" id="sections">
    <section>
      <h2>Rhythm</h2>
      <div class="stepper-row">
        <span>Remind me every</span>
        <div class="stepper">
          <button data-step="intervalMinutes" data-dir="-1" aria-label="Fewer minutes">−</button>
          <span class="value"><span id="intervalMinutes"></span> min</span>
          <button data-step="intervalMinutes" data-dir="1" aria-label="More minutes">+</button>
        </div>
      </div>
      <div class="stepper-row">
        <span>Rest for</span>
        <div class="stepper">
          <button data-step="restSeconds" data-dir="-1" aria-label="Fewer seconds">−</button>
          <span class="value"><span id="restSeconds"></span> sec</span>
          <button data-step="restSeconds" data-dir="1" aria-label="More seconds">+</button>
        </div>
      </div>
    </section>

    <section>
      <div class="h2-row"><h2>Who peeks</h2><span class="hint">Pick any</span></div>
      <div class="chips" id="chips"></div>
    </section>

    <section class="where">
      <div>
        <h2>Where</h2>
        <span class="corner-label" id="cornerLabel"></span>
      </div>
      <div class="corner-picker" id="corners">
        <button data-corner="top-left" aria-label="Top left"></button>
        <button data-corner="top-right" aria-label="Top right"></button>
        <button data-corner="bottom-left" aria-label="Bottom left"></button>
        <button data-corner="bottom-right" aria-label="Bottom right"></button>
      </div>
    </section>
  </div>

  <footer>
    <button class="preview" id="preview">Preview now</button>
    <div class="foot-row">
      <span>GIFs Powered by GIPHY</span>
      <button class="link" id="keyToggle" aria-expanded="false">GIPHY key</button>
    </div>
    <div class="key-box" id="keyBox" hidden>
      <label for="giphyKey">Your GIPHY API key</label>
      <div class="key-row">
        <input id="giphyKey" type="text" spellcheck="false" autocomplete="off">
        <button id="keySave">Save</button>
      </div>
    </div>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
